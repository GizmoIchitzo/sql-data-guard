[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-data-guard"
version = "0.1.0"  # Compliant version for uv in dev (reverted to "UPDATED-BY-WORKFLOW" before commit)
description = "Safety Layer for LLM Database Interactions"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE.md"}
authors = [
  { name="Imperva - Threat Research Infra", email="ww.dis.imperva.threat-research-infra@thalesgroup.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Database",
]
dependencies = [
    "sqlglot>=23.0.0",  # Core dependency required for library usage
]

[project.urls]
Homepage = "https://github.com/ThalesGroup/sql-data-guard"
Issues = "https://github.com/ThalesGroup/sql-data-guard/issues"

[project.optional-dependencies]
# Optional service runtimes deployed by users
api = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
]
mcp = [
    "docker>=7.0.0",
]

[dependency-groups]
# Modular setups for internal project development, testing, and compilation
dev = [
    "ruff>=0.3.0",
    "ty>=0.0.1",
    { include-group = "test" },
    { include-group = "docs" },
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "duckdb>=0.9.0",
    "httpx>=0.25.0",  # Required to test FastAPI endpoints using TestClient
    "boto3>=1.34.0",
    "langchain-aws>=0.1.0",
]
docs = [
    "sphinx>=7.2.6",
    "sphinx-rtd-theme>=2.0.0",
    "myst-parser>=2.0.0",  # Allows Sphinx to read Markdown docs directly
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = [
    "sql_data_guard",
    "sql_data_guard.core",
    "sql_data_guard.api",
    "sql_data_guard.mcp",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "I",     # isort (import sorting)
    "B",     # flake8-bugbear (common bugs)
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade (modern python syntax)
    "S",     # flake8-bandit (security checks)
    "A",     # flake8-builtins
    "COM",   # flake8-commas
    "PT",    # flake8-pytest-style
    "ARG",   # flake8-unused-arguments
    "SIM",   # flake8-simplify
    "RUF",   # Ruff-specific rules
]
ignore = [
    "D",       # Ignore missing docstrings globally
    "COM812",  # Conflict with formatter
    "ISC001",  # Conflict with formatter
    "S101",    # Allow assert statements in tests
    "S603",    # Allow calling subprocesses
    "S607",    # Allow partial executable paths
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--color=yes -v"
